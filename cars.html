<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>T.B Shots - Cars</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    /* Modal container */
    .modal {
      display: none; 
      position: fixed; 
      z-index: 1000; 
      padding-top: 60px; 
      left: 0;
      top: 0;
      width: 100%; 
      height: 100%; 
      overflow: auto;
      background-color: rgba(0,0,0,0.8); 
    }
    /* Modal Content (Image) */
    #modal-image {
      display: block;
      margin: auto;
      max-width: 80%;
      max-height: 80%;
    }
    /* Close button */
    .close {
      position: absolute;
      top: 20px;
      right: 35px;
      color: #fff;
      font-size: 40px;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <!-- Header Section -->
  <header>
    <div class="logo">
      <img src="TBSHOTSLOGO-removebg-preview.png" alt="TB Shots Logo">
    </div>
    <nav>
      <ul>
        <li><a href="index.html#home">Home</a></li>
        <li class="dropdown">
          <a href="index.html#portfolio">Portfolio</a>
          <div class="dropdown-content">
            <a href="cars.html">Cars</a>
            <a href="miscellaneous.html">Film Work</a>
          </div>
        </li>
        <li><a href="index.html#booking">Booking</a></li>
        <li><a href="index.html#about">About Me</a></li>
        <li>
          <a href="https://www.instagram.com/t.b.shots/" target="_blank">
            <img src="instagramicon.jpg" alt="Instagram Logo" width="30px" height="30px">
          </a>
        </li>
      </ul>
    </nav>
  </header>

  <!-- Cars Section -->
  <section id="cars" class="portfolio-section">
    <h2>Cars</h2>
    <div class="gallery">
      <!-- Gallery Images -->
      <img src="amglogo.jpg" alt="">
      <img src="IMG_1167.jpg" alt="">
      <img src="IMG_1172.jpg" alt="">
      <img src="IMG_1201.jpg" alt="">
      <img src="IMG_1202.jpg" alt="">
      <img src="IMG_1218.jpg" alt="">

      <!-- Additional images as needed -->
      <img src="IMG_0363.jpg" alt="">
      <img src="IMG_0364.jpg" alt="">
      <img src="IMG_0361.jpg" alt="">
      <img src="IMG_0350.jpg" alt="">
      <img src="IMG_0351.jpg" alt="">
      <!-- ... include the rest of your images ... -->
    </div>
  </section>

  <!-- Modal for Enlarged Image -->
  <div id="modal" class="modal">
    <span class="close">&times;</span>
    <img class="modal-content" id="modal-image" alt="Enlarged Image">
  </div>

  <!-- Footer Section -->
  <footer>
    <div class="social-media">
      <a href="https://www.instagram.com/t.b.shots/" target="_blank">
        <img src="instagram-logo.jpg" alt="Instagram Logo">
      </a>
    </div>
    <p>&copy; 2025 T.B. Shots. All Rights Reserved.</p>
    <div class="footer-links">
      <h4><a href="cars.html" style="color: white;">Cars</a></h4>
      <h4><a href="miscellaneous.html" style="color: white;">Film Work</a></h4>
    </div>
    <p style="margin-top: 25px;">Website developed and designed by:</p>
    <div style="display: flex; justify-content: center; gap: 20px; flex-wrap: wrap; margin-top: 10px;">
      <div style="text-align: center;">
        <h4><a href="https://www.linkedin.com/in/hamza-muhammad-b01164178/" target="_blank" style="color: white;">Hamza Muhammad</a></h4>
      </div>
      <div style="text-align: center;">
        <h4><a href="https://www.linkedin.com/in/jared-dimacali-157647305/" target="_blank" style="color: white;">Jared Dimacali</a></h4>
      </div>
      <div style="text-align: center;">
        <h4><a href="" target="_blank" style="color: white;">Omar Schwartz</a></h4>
      </div>
      <div style="text-align: center;">
        <h4><a href="https://www.linkedin.com/in/marclesterpasag/" target="_blank" style="color: white;">Marc Pasag</a></h4>
      </div>
    </div>
  </footer>

  <!-- JavaScript for Modal -->
  <script>
    document.addEventListener("DOMContentLoaded", function() {
      // Get modal elements
      const modal = document.getElementById("modal");
      const modalImg = document.getElementById("modal-image");
      const closeBtn = document.querySelector(".close");

      // Select all images within the gallery
      const galleryImages = document.querySelectorAll(".gallery img");
      galleryImages.forEach(image => {
        image.addEventListener("click", function() {
          modal.style.display = "block";
          modalImg.src = this.src;  // Use the clicked image's src for the modal image
        });
      });

      // Close the modal when the close button is clicked
      closeBtn.addEventListener("click", function() {
        modal.style.display = "none";
      });

      // Also close the modal when clicking anywhere outside the image
      modal.addEventListener("click", function(e) {
        if (e.target === modal) {
          modal.style.display = "none";
        }
      });
    });
  </script>
</body>
</html>
